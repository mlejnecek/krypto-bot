name: Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Kolik dní historie otestovat'
        default: '180'

permissions:
  contents: write

concurrency:
  group: paper-bot          # nekolidovat s hodinovým botem při ukládání
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Spustit backtest
        run: python3 backtest.py "${{ github.event.inputs.days }}"

      - name: Uložit výsledky
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add backtest/
          git diff --cached --quiet || git commit -m "Backtest $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
