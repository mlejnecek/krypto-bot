name: Backtest potvrzeni

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Spustit test filtru
        run: python3 backtest_potvrzeni.py

      - name: Uložit výsledky
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add backtest/
          git diff --cached --quiet && exit 0
          git commit -m "Potvrzeni $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((i * 15))
          done
          exit 1
