name: BTC trend bot

on:
  schedule:
    - cron: '13 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Spustit BTC bota
        run: python3 bot_btc.py

      - name: Uložit výsledky
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "BTC bot $(date -u +'%Y-%m-%d')"
          git pull --rebase
          git push
