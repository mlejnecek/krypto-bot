name: BTC trend bot

on:
  schedule:
    - cron: '13 0 * * *'
    - cron: '13 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Spustit BTC bota
        run: python3 bot_btc.py

      - name: Uložit výsledky
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "BTC bot $(date -u +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            echo "Push selhal, zkouším znovu za $((i * 15)) s…"
            sleep $((i * 15))
          done
          exit 1
